name: Publish to NPM

permissions:
  contents: read
  id-token: write

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - uses: pnpm/action-setup@v3
        name: Install pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm publish --access public
